name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Capacitor
        run: npm install

      - name: Copy web files
        run: |
          mkdir -p www
          cp index.html manifest.json sw.js icon-192.png icon-512.png icon-maskable-512.png www/

      - name: Add Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: Use our icon
        run: |
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          for d in android/app/src/main/res/mipmap-*; do
            cp icon-192.png "$d/ic_launcher.png"
            cp icon-192.png "$d/ic_launcher_round.png"
          done

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: pnl-journal-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
